services:
  ollama:
    image: ollama/ollama:latest
    container_name: snaplist-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  ollama-model-pull:
    image: curlimages/curl:latest
    container_name: snaplist-ollama-model-pull
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    command:
      - -s
      - http://ollama:11434/api/pull
      - -d
      - "{\"model\":\"${OLLAMA_MODEL}\"}"

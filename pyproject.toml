[project]
name = "snaplist"
version = "0.1.0"
description = "AI-powered listing creator for eBay and Kleinanzeigen"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "Pillow>=11.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "ddgs>=9.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
playwright = ["playwright>=1.40.0"]

[project.scripts]
snaplist = "snaplist.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["snaplist"]

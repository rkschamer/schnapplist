[project]
name = "schnapplist"
version = "0.1.0"
description = "AI-powered listing creator for eBay and Kleinanzeigen"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=11.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "litellm>=1.72.0",
    "ddgs>=9.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
playwright = ["playwright>=1.40.0"]

[project.scripts]
schnapplist = "schnapplist.cli:main"

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-mock",
    "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["schnapplist"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
